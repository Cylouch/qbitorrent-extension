<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <script src="../lib/theme-boot.js"></script>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header class="head">
    <span class="logo" data-icon="logo"></span>
    <div class="who">
      <strong>qBittorrent</strong>
      <span id="srv" class="faint"></span>
    </div>
    <button type="button" class="btn btn-ghost btn-icon btn-sm" id="altBtn" title="Limites de vitesse alternatives" hidden><i data-icon="gauge"></i></button>
    <button type="button" class="btn btn-ghost btn-icon btn-sm" id="feedsBtn" title="Nouveautés des indexeurs (derniers films et séries)"><i data-icon="sparkles"></i></button>
    <button type="button" class="btn btn-ghost btn-icon btn-sm" id="filesBtn" title="Explorateur du serveur (disques et dossiers)" hidden><i data-icon="folderOpen"></i></button>
    <button type="button" class="btn btn-ghost btn-icon btn-sm" id="themeBtn"></button>
    <button type="button" class="btn btn-ghost btn-icon btn-sm" id="opts" title="Paramètres"><i data-icon="settings"></i></button>
  </header>

  <section id="setup" class="setup" hidden>
    <span class="logo big" data-icon="logo"></span>
    <h2>Bienvenue !</h2>
    <p class="muted">Connecte ton serveur qBittorrent pour envoyer tes torrents en un clic.</p>
    <button id="setupBtn" class="btn btn-primary"><i data-icon="server"></i>Configurer mon serveur</button>
  </section>

  <section id="content" hidden>
    <div class="status-row">
      <span class="pill" id="statusPill"><span class="dot wait" id="dot"></span><span id="statusText">Connexion…</span></span>
      <button type="button" class="pill pill-btn" id="disksBtn" title="Afficher les disques du serveur"><i data-icon="hardDrive"></i><span id="free">–</span><i data-icon="chevronDown" class="pill-chev"></i></button>
    </div>

    <section class="disks" id="disks" hidden>
      <header class="disks-head">
        <span class="disks-title">Disques du serveur</span>
        <button type="button" class="btn btn-ghost btn-icon btn-sm" id="disksRefresh" title="Actualiser"><i data-icon="refresh"></i></button>
        <button type="button" class="btn btn-ghost btn-sm" id="disksOpen" title="Parcourir les dossiers du serveur"><i data-icon="folderOpen"></i>Explorateur</button>
      </header>
      <ul class="dlist" id="dlist"></ul>
    </section>

    <div class="stats">
      <div class="stat dl">
        <div class="stat-top"><span class="stat-ico" data-icon="arrowDown"></span>Réception</div>
        <div class="stat-val" id="dl">–</div>
        <div class="stat-sub" id="dlSub"></div>
        <svg class="spark" id="dlSpark" viewBox="0 0 100 32" preserveAspectRatio="none"></svg>
      </div>
      <div class="stat ul">
        <div class="stat-top"><span class="stat-ico" data-icon="arrowUp"></span>Envoi</div>
        <div class="stat-val" id="ul">–</div>
        <div class="stat-sub" id="ulSub"></div>
        <svg class="spark" id="ulSpark" viewBox="0 0 100 32" preserveAspectRatio="none"></svg>
      </div>
    </div>

    <div id="err" class="banner error" hidden><i data-icon="alert"></i><span class="grow" id="errText"></span></div>

    <form id="quickAdd" class="row">
      <div class="field-icon grow">
        <i data-icon="magnet"></i>
        <input class="input" id="quickLink" type="text" placeholder="Coller un lien magnet ou une URL…" spellcheck="false">
      </div>
      <button class="btn btn-primary btn-icon" type="submit" title="Ajouter"><i data-icon="plus"></i></button>
    </form>

    <div class="list-head">
      <div class="seg" id="tabs">
        <label><input type="radio" name="filter" value="all"><span>Tous <em id="cAll"></em></span></label>
        <label><input type="radio" name="filter" value="dl"><span>En cours <em id="cDl"></em></span></label>
        <label><input type="radio" name="filter" value="done"><span>Terminés <em id="cDone"></em></span></label>
        <label><input type="radio" name="filter" value="stopped"><span>Arrêtés <em id="cStopped"></em></span></label>
      </div>
      <button type="button" class="btn btn-ghost btn-icon btn-sm" id="searchBtn" title="Rechercher"><i data-icon="search"></i></button>
    </div>
    <div class="field-icon" id="searchBox" hidden>
      <i data-icon="search"></i>
      <input class="input" id="search" type="search" placeholder="Rechercher un torrent…">
    </div>

    <ul class="tlist" id="list"></ul>
  </section>

  <footer class="foot">
    <button type="button" class="btn" id="addFile"><i data-icon="file"></i>Fichier .torrent</button>
    <button type="button" class="btn" id="webui"><i data-icon="external"></i>Interface web</button>
  </footer>
</body>
</html>
